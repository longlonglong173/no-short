name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate repository
        run: npm run validate

      - name: Validate website scripts and theme behavior
        run: |
          node --check website/app.js
          node --check website/skills.js
          node --check website/theme.js
          node --test website/tests/*.test.mjs

  usage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --cwd packages/usage --frozen-lockfile
      - name: Install pinned Codex for plugin discovery regression
        run: npm install --prefix .artifacts/codex-cli --no-package-lock @openai/codex@0.147.0
      - name: Linux source and kernel transaction lock tests
        run: bun scripts/release/run-isolated.ts npm test
        env:
          NO_SHORT_TEST_CODEX_CLI: ${{ github.workspace }}/.artifacts/codex-cli/node_modules/.bin/codex
      - run: npm run typecheck:usage
      - run: bun run --cwd packages/usage build:ui
      - run: cd packages/usage && bunx playwright install --with-deps chromium
      - run: npm run test:usage:browser

  # Preserve required check names while building each host only once.
  usage-macos:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      NO_SHORT_EXPECTED_ARCH: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: test "$(xcodebuild -version | head -1)" = 'Xcode 16.4' && swift --version && test "$(uname -m)" = arm64
      - run: bun install --cwd packages/usage --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Prepare unsigned frozen candidate and exercise extracted ARM runtime
        run: bun run prepare:experimental-release "$(node -p 'require("./package.json").version')" "$PWD/.artifacts/candidate"
      - name: Required final-artifact negative and runtime tests
        run: NO_SHORT_RELEASE_VERSION="$(node -p 'require("./package.json").version')" bun scripts/release/run-isolated.ts bun run test:release-artifacts
        env:
          NO_SHORT_RELEASE_CANDIDATE: ${{ github.workspace }}/.artifacts/candidate
      - uses: actions/upload-artifact@v4
        with:
          name: no-short-local-test-package
          path: .artifacts/candidate/

  usage-menubar-macos:
    runs-on: macos-15-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      NO_SHORT_EXPECTED_ARCH: x64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: test "$(xcodebuild -version | head -1)" = 'Xcode 16.4' && swift --version && test "$(uname -m)" = x86_64
      - run: bun install --cwd packages/usage --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: bun scripts/release/run-isolated.ts npm run test:usage-menubar
      - name: Prepare unsigned frozen candidate and exercise extracted Intel runtime
        run: bun run prepare:experimental-release "$(node -p 'require("./package.json").version')" "$PWD/.artifacts/candidate"
      - name: Required final-artifact negative and runtime tests
        run: NO_SHORT_RELEASE_VERSION="$(node -p 'require("./package.json").version')" bun scripts/release/run-isolated.ts bun run test:release-artifacts
        env:
          NO_SHORT_RELEASE_CANDIDATE: ${{ github.workspace }}/.artifacts/candidate
      - uses: actions/upload-artifact@v4
        with:
          name: no-short-usage-menubar-local-builds
          path: .artifacts/candidate/
