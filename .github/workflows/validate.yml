name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate repository
        run: npm run validate

  usage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --cwd packages/usage --frozen-lockfile
      - name: Install pinned Codex for plugin discovery regression
        run: npm install --prefix .artifacts/codex-cli --no-package-lock @openai/codex@0.147.0
      - run: npm test
        env:
          NO_SHORT_TEST_CODEX_CLI: ${{ github.workspace }}/.artifacts/codex-cli/node_modules/.bin/codex
      - run: npm run typecheck:usage
      - run: bun run --cwd packages/usage build:ui
      - run: cd packages/usage && bunx playwright install --with-deps chromium
      - run: npm run test:usage:browser

  usage-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --cwd packages/usage --frozen-lockfile
      - run: npm run build:usage
      - name: Install pinned Codex for plugin discovery regression
        run: npm install --prefix .artifacts/codex-cli --no-package-lock @openai/codex@0.147.0
      - run: npm test
        env:
          NO_SHORT_TEST_CODEX_CLI: ${{ github.workspace }}/.artifacts/codex-cli/node_modules/.bin/codex
      - run: npm run smoke:usage
      - run: npm run package:usage
      - uses: actions/upload-artifact@v4
        with:
          name: no-short-local-test-package
          path: .artifacts/usage/releases/no-short-0.4.1.zip


  usage-menubar-macos:
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift 6 toolchain
        run: |
          xcodebuild -version
          swift --version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --cwd packages/usage --frozen-lockfile
      - run: bun run --cwd packages/usage build
      - run: npm run test:usage-menubar
      - run: npm run build:usage-menubar
      - run: npm run smoke:usage-menubar
      - run: npm run package:usage-menubar
      - uses: actions/upload-artifact@v4
        with:
          name: no-short-usage-menubar-local-builds
          path: .artifacts/usage-menubar/releases/
